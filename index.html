<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Slider</title>
    <style>
        /* 1. The Main Parent Container */
        .slider-box {
            position: relative;
            /* Crucial: establishes the bounding box for absolute children */
            width: 450px;
            height: 320px;
            background-color: #f38a9a;
            /* The pink background */
            margin: 100px auto;
            /* Centers the whole box on your webpage */
        }

        /* 2. The Center Number */
        .center-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Perfectly centers it both horizontally and vertically */
            color: white;
            font-size: 28px;
            font-family: Arial, sans-serif;
        }

        /* 3. The Left and Right Arrows */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            /* Centers vertically on the left/right edges */
            width: 45px;
            height: 45px;
            background-color: #333;
            color: white;
            border-radius: 50%;
            /* Makes them circles */
            text-align: center;
            line-height: 45px;
            /* Vertically centers the arrow icon inside the circle */
            font-size: 18px;
            cursor: pointer;
        }

        .left-arrow {
            left: -22px;
            /* Pulls it halfway outside the left edge */
        }

        .right-arrow {
            right: -22px;
            /* Pulls it halfway outside the right edge */
        }

        /* 4. The Bottom Dots */
        .pagination-dots {
            position: absolute;
            bottom: 15px;
            /* Anchors them to the bottom edge */
            left: 50%;
            transform: translateX(-50%);
            /* Centers them horizontally */
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #222;
            border-radius: 50%;
            margin: 0 4px;
            /* Spaces them out slightly */
        }
    </style>
</head>

<body>

    <div class="slider-box">

        <!-- Left Arrow -->
        <div class="arrow left-arrow">&#9664;</div> <!-- Unicode left triangle -->

        <!-- Center Content -->
        <div class="center-number">1</div>

        <!-- Right Arrow -->
        <div class="arrow right-arrow">&#9654;</div> <!-- Unicode right triangle -->

        <!-- Bottom Dots -->
        <div class="pagination-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

    </div>

</body>

</html>
